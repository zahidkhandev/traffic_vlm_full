name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint
        run: |
          ruff check qwen_auto_qc tests
          ruff format --check qwen_auto_qc tests
          pylint qwen_auto_qc --fail-under=8.0

      - name: Type check
        run: mypy qwen_auto_qc

      - name: Test
        run: pytest tests --basetemp=pytest_tmp -p no:cacheprovider --cov=qwen_auto_qc --cov-report=term-missing --cov-fail-under=70

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Verify wheel install
        run: |
          pip uninstall -y qwen-auto-qc || true
          pip install dist/*.whl
          python -c "import qwen_auto_qc; print(qwen_auto_qc.__name__)"
